name: Perbarui daftar arsip

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buat ulang daftar arsip
        run: node scripts/update-archive-list.mjs

      - name: Commit dan push
        run: |
          if git diff --quiet README.md; then
            echo "Daftar arsip tidak berubah, tidak ada commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: pembaharuan daftar arsip"
          git push
